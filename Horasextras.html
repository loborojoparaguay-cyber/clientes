<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Asistencia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

    <!-- Pantalla de Inicio de Sesión -->
    <div id="login-view" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-slate-200">
            <div class="text-center mb-8">
                <div class="bg-blue-600 text-white w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 shadow-md">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <h1 class="text-2xl font-bold text-slate-800">Control de Horarios</h1>
            </div>
            
            <div class="mb-6">
                <label class="block text-sm font-semibold text-slate-700 mb-2">Seleccione su Usuario:</label>
                <!-- Menú desplegable con los usuarios -->
                <select id="username" class="w-full border border-slate-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white cursor-pointer text-lg">
                    <option value="" disabled selected>Selecciona tu nombre...</option>
                    <option value="Bruno Roa">Bruno Roa</option>
                    <option value="Jesús Barrios">Jesús Barrios</option>
                    <option value="Ronney Valdez">Ronney Valdez</option>
                    <option value="Edgar Arzamendia">Edgar Arzamendia</option>
                </select>
            </div>
            <button onclick="login()" class="w-full bg-blue-600 text-white font-bold p-3 rounded-lg hover:bg-blue-700 transition shadow-md">
                Ingresar
            </button>
        </div>
    </div>

    <!-- Panel Principal -->
    <div id="dashboard-view" class="hidden min-h-screen p-4 md:p-8">
        <div class="max-w-2xl mx-auto space-y-6">
            
            <!-- Cabecera -->
            <div class="bg-white rounded-xl shadow-sm border p-6 flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-bold">Hola, <span id="user-display" class="text-blue-600"></span></h1>
                    <p class="text-sm text-slate-500">Jornada estándar: 07:00 a 17:30</p>
                </div>
                <button onclick="logout()" class="bg-slate-200 text-slate-700 text-sm font-medium px-4 py-2 rounded-lg hover:bg-slate-300 transition">
                    Salir
                </button>
            </div>

            <!-- TARJETA DE BALANCE GENERAL -->
            <div id="balance-container" class="bg-slate-50 border border-slate-200 rounded-xl p-5 flex items-center justify-between shadow-sm transition-all">
                <div>
                    <h3 id="balance-label" class="text-sm font-bold uppercase tracking-wider mb-1 text-slate-800">Balance General</h3>
                    <p id="balance-text" class="text-2xl md:text-3xl font-black text-slate-700">Calculando...</p>
                </div>
            </div>

            <!-- Formulario de Carga -->
            <div class="bg-white rounded-xl shadow-sm border p-6">
                <h2 class="text-lg font-bold mb-4 border-b pb-2">Registrar Horario de Hoy</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Fecha:</label>
                        <input type="date" id="date-input" class="w-full border p-2.5 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Entrada:</label>
                        <input type="time" id="entry-input" class="w-full border p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Salida:</label>
                        <input type="time" id="exit-input" class="w-full border p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="flex items-end">
                        <button onclick="saveRecord()" class="w-full bg-green-600 text-white font-bold p-2.5 rounded-lg hover:bg-green-700 transition shadow-sm" id="btn-save">
                            Guardar y Enviar
                        </button>
                    </div>
                </div>
            </div>

            <!-- HISTORIAL DÍA POR DÍA -->
            <div class="bg-white rounded-xl shadow-sm border p-6">
                <h2 class="text-lg font-bold mb-4 border-b pb-2">Mi Historial</h2>
                <div id="history-list" class="space-y-1">
                    <!-- Los registros se cargan aquí por JS -->
                </div>
            </div>

        </div>
    </div>

    <script>
        // Tu URL de Google Sheets
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyuSCyitdcUPtMU6v8UTHptv1MvfwP_i8gMEm3v_9JS-fK_QETKH4EGX-hQLckE5YJg/exec"; 
        
        const REQUIRED_MINS = 630; // 10h 30m
        const GRACE_MINS = 15;
        let currentUser = '';
        
        // Cargar base de datos local
        let db = JSON.parse(localStorage.getItem('work_hours_db')) || {};

        function login() {
            const userSelect = document.getElementById('username');
            if(!userSelect.value) {
                Swal.fire({ icon: 'warning', text: 'Por favor, selecciona tu nombre.' });
                return;
            }
            currentUser = userSelect.value;
            
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');
            document.getElementById('user-display').innerText = currentUser;
            
            // Forzar fecha actual
            const today = new Date();
            const localDateStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
            document.getElementById('date-input').value = localDateStr;

            renderDashboard(); // Calcular balance y cargar lista
        }

        function logout() {
            currentUser = '';
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('login-view').classList.remove('hidden');
            document.getElementById('username').value = '';
        }

        function minsToStr(mins) {
            const absMins = Math.abs(mins);
            const h = Math.floor(absMins / 60);
            const m = absMins % 60;
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
        }

        function renderDashboard() {
            if(!db[currentUser]) db[currentUser] = {};
            const records = db[currentUser];
            let tExtra = 0;
            let tDebe = 0;
            
            const list = document.getElementById('history-list');
            list.innerHTML = '';
            
            // Ordenar fechas de más reciente a más antigua
            const dates = Object.keys(records).sort((a,b) => b.localeCompare(a));
            
            dates.forEach(date => {
                const r = records[date];
                tExtra += (r.extra || 0);
                tDebe += (r.deficit || 0);
                
                let badge = '';
                if(r.extra > 0 && r.deficit === 0) {
                    badge = `<span class="bg-green-100 text-green-700 px-2 py-1 rounded text-xs font-bold">+ ${minsToStr(r.extra)} hs (A favor)</span>`;
                } else if(r.deficit > 0) {
                    badge = `<span class="bg-red-100 text-red-700 px-2 py-1 rounded text-xs font-bold">- ${minsToStr(r.deficit)} hs (Debe)</span>`;
                } else {
                    badge = `<span class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs font-bold">Al día</span>`;
                }
                
                // Formatear fecha a DD/MM/YYYY
                const dateShow = date.split('-').reverse().join('/');

                list.innerHTML += `
                    <div class="flex justify-between items-center border-b border-slate-100 py-3 last:border-0">
                        <div>
                            <p class="font-bold text-slate-800 text-sm">${dateShow} <span class="text-xs font-normal text-slate-500">(${r.dia})</span></p>
                            <p class="text-xs text-slate-600 mt-0.5">Marcó: ${r.entrada} a ${r.salida}</p>
                        </div>
                        <div>${badge}</div>
                    </div>
                `;
            });
            
            if(dates.length === 0) {
                list.innerHTML = '<p class="text-slate-500 text-sm text-center py-4">Aún no hay historial guardado.</p>';
            }
            
            // --- CÁLCULO GENERAL NETO ---
            let balance = tExtra - tDebe; // Resta matemática principal
            
            let bContainer = document.getElementById('balance-container');
            let bText = document.getElementById('balance-text');
            let bLabel = document.getElementById('balance-label');
            
            if(balance > 0) {
                bContainer.className = "bg-green-50 border border-green-300 rounded-xl p-5 flex items-center justify-between shadow-sm";
                bText.className = "text-2xl md:text-3xl font-black text-green-700";
                bText.innerText = "+ " + minsToStr(balance) + " hs";
                bLabel.innerText = "¡Tienes Horas a Favor!";
                bLabel.className = "text-sm font-bold uppercase tracking-wider mb-1 text-green-800";
            } else if(balance < 0) {
                bContainer.className = "bg-red-50 border border-red-300 rounded-xl p-5 flex items-center justify-between shadow-sm";
                bText.className = "text-2xl md:text-3xl font-black text-red-700";
                bText.innerText = "- " + minsToStr(Math.abs(balance)) + " hs";
                bLabel.innerText = "Horas Adeudadas Totales";
                bLabel.className = "text-sm font-bold uppercase tracking-wider mb-1 text-red-800";
            } else {
                bContainer.className = "bg-blue-50 border border-blue-200 rounded-xl p-5 flex items-center justify-between shadow-sm";
                bText.className = "text-2xl md:text-3xl font-black text-blue-700";
                bText.innerText = "00:00 hs";
                bLabel.innerText = "Estás al Día";
                bLabel.className = "text-sm font-bold uppercase tracking-wider mb-1 text-blue-800";
            }
        }

        async function saveRecord() {
            const date = document.getElementById('date-input').value;
            const entry = document.getElementById('entry-input').value;
            const exit = document.getElementById('exit-input').value;
            const btnSave = document.getElementById('btn-save');
            
            if(!entry || !exit) {
                Swal.fire({ icon: 'error', text: 'Debes completar entrada y salida.' });
                return;
            }

            const [eH, eM] = entry.split(':').map(Number);
            const [xH, xM] = exit.split(':').map(Number);
            const totalMins = (xH * 60 + xM) - (eH * 60 + eM);
            
            if (totalMins < 0) {
                Swal.fire({ icon: 'error', text: 'Salida inválida (es menor a la entrada).' });
                return;
            }

            let deficit = 0;
            let extra = 0;
            const dateObj = new Date(date + "T00:00:00");
            const isWeekend = (dateObj.getDay() === 0 || dateObj.getDay() === 6);

            if (isWeekend) {
                extra = totalMins;
            } else {
                if (totalMins < REQUIRED_MINS) {
                    deficit = REQUIRED_MINS - totalMins;
                } else if (totalMins > (REQUIRED_MINS + GRACE_MINS)) {
                    extra = totalMins - REQUIRED_MINS;
                }
            }

            // Guardar localmente para mantener el historial
            db[currentUser][date] = {
                dia: isWeekend ? "Finde" : "Semana",
                entrada: entry,
                salida: exit,
                extra: extra,
                deficit: deficit,
                totalMins: totalMins
            };
            localStorage.setItem('work_hours_db', JSON.stringify(db));
            
            // Refrescar el cálculo en pantalla inmediatamente
            renderDashboard();

            // Enviar a la hoja de Google Sheets
            btnSave.disabled = true;
            btnSave.innerText = "Enviando a Base de Datos...";

            const payload = {
                usuario: currentUser,
                fecha: date,
                dia: isWeekend ? "Finde" : "Semana",
                entrada: entry,
                salida: exit,
                total_horas: minsToStr(totalMins),
                horas_extra: minsToStr(extra),
                horas_deuda: minsToStr(deficit)
            };

            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                Swal.fire({ icon: 'success', title: 'Guardado', text: 'Horario enviado y balance actualizado.', timer: 2000 });
                // Ya no cerramos sesión automáticamente para que el usuario pueda ver su balance actualizado.
            } catch (error) {
                Swal.fire({ icon: 'warning', title: 'Aviso', text: 'Se guardó en tu historial, pero hubo un error al enviar a la nube.' });
            } finally {
                btnSave.disabled = false;
                btnSave.innerText = "Guardar y Enviar";
            }
        }
    </script>
</body>
</html>
